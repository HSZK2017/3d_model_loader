org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Build JVM. The machine's JAVA_HOME is unset and `java` on PATH is JDK 26,
## which ForgeGradle 6 cannot drive. Pin the build JVM explicitly and keep the
## compile toolchain at 17 (see build.gradle). Forward slashes: backslashes in a
## .properties value are escape characters.
org.gradle.java.home=E:/Program Files/Java/jdk-17
## JDK auto-detection probes C:\Program Files\Java\jre1.8.0_451, a JRE without
## jvm.cfg; the probe process dies and takes the build with it.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=E:/Program Files/Java/jdk-17,E:/Program Files/Java/jdk-21.0.12

## Mappings. Parchment gives real parameter names on top of official mappings.
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.16
forge_version_range=[47,)
loader_version_range=[47,)

## Mod properties. mod_id must match the @Mod annotation and the [a-z][a-z0-9_] regex.
mod_id=model3d
mod_name=Model3D Loader API
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.model3d.loader
mod_authors=Model3D
mod_description=Runtime loader for common 3D model formats (glTF/GLB, OBJ/MTL) with glTF skeletal animation playback, exposed as a public API for other mods.

